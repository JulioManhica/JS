        <input type="text" name="" id="nomeX" placeholder="Digite o seu nome">
        <button id="btn">
            Salvar
        </button>
        <h2 id="resultado"></h2> 

        <script>

            let input1 = document.querySelector('#nomeX')
            let btn1 = document.querySelector('#btn')
            let res1 = document.querySelector('#resultado')

            btn1.addEventListener('click',()=>{

                const name = input1.value.trim()
                
                if(name == ''){

                    alert('[ERRO] digite o seu nome')
                    return

                }

                localStorage.setItem('nome', name)
                res1.textContent = `Olá, ${name}.`


            })



        </script>
