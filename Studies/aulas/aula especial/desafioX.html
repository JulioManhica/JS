    <!-- #============= DESAFIO 1 =================# -->

    <div class="click">

            <button id="btn-click">CLIQUE!</button>

            <div id="number-click">

                0

               
                
            </div>

            <p>2 inputs: Nome e Idade. Um btn "SALVAR". Mostra embaixo "Ola Joao, voce tem 20 anos". Salva os 2 no localStorage e carrega quando abrir. </p>


    </div>
    <!-- #============= DESAFIO 2 =================# -->

            TROCAR TEMA
        </button>

    <!-- #============= DESAFIO 3 =================# -->

    <div class="click">

        <h2>#Desafio 3</h2>
    <form action="#">
    
            <label for="nome">Nome
                <input type="text" name="" id="nome" placeholder="digite o seu nome">
            </label>
            <br>
            <br>
    
            <label for="idade">Idade
                <input type="number" name="" id="idade" >
            </label>

            <br>
            <br>

            <button id="btn-salvar">Salvar</button>

            <br>
            <br>

            <div id="res">

            </div>
    </form>
        






    </div>

  <!-- #============= DESAFIO 1 =================# -->
<script>

    let btn = document.querySelector('#btn-click')
    let num = document.querySelector('#number-click')
    let lastNUm = localStorage.getItem('lastNUm')
    let n1 = Number(lastNUm)  || 0 
    num.textContent = n1
    // lastNUm.textContent = n1
    
    btn.addEventListener('click',()=>{

        n1+=1
        num.textContent = n1
        localStorage.setItem('lastNUm',n1)
        

       
    } )



</script>
 <!-- #============= DESAFIO 2 =================# -->
<script>
    let btnFundo = document.querySelector('#btn-fundo')
    let body = document.querySelector('body')
    let save = localStorage.getItem('salvo')
    

    btnFundo.addEventListener('click', ()=>{

        body.classList.toggle('escuro')
        if(body.classList.contains('escuro')){

            btnFundo.textContent = 'Claro'
            localStorage.setItem('salvo','escuro')

        } else{

            btnFundo.textContent = 'Escuro'
            localStorage.setItem('salvo','claro')


        }

    })

    if(save === 'escuro'){

        body.classList.add('escuro')
        btnFundo.textContent = 'Claro'
        

    }

    





</script>

<!-- #============= DESAFIO 3 =================# -->
<script>
    
    let inputNome = document.querySelector('#nome') 
    let inputIdade = document.querySelector('#idade') 
    let btnSalvar = document.querySelector('#btn-salvar') 
    let res = document.querySelector('#res') 
    let dadoSalvo = localStorage.getItem('dados')
    
    if(dadoSalvo){
    
        let dados = JSON.parse(dadoSalvo)

        // inputNome = dados.nome
        // inputIdade = dados.idade
        
            res.textContent = `Ola, ${dados.nome}, a sua idade e ${dados.idade}`
    
    }
    
    btnSalvar.addEventListener('click',()=>{
        let nome = inputNome.value.trim()
        let idade = inputIdade.value.trim()

        if(nome == "" || idade == ""){
    
            alert(`[ERRO]por favor , preencha os campos`)
    
        } else{


            res.textContent = `Ola, ${nome}, a sua idade e ${idade}`

            
                    let  dados = {nome:nome, idade:idade}
                    
                    localStorage.setItem('dados',JSON.stringify(dados))
        }
    
    })

    
    

</script>
